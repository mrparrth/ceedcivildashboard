,"rate":2000,"detail":"OPTIONAL - Ceed Civil Engineering\'s partner will perform the field run topography for the entire property, calculate MSL elevations, and prepare a plan showing existing site topography with 2-ft contour intervals @ 20-ft scale. The Survey will include a 50-foot overlap around the peripheral boundary of the property. All existing vegetation shall be depicted on the plan. Spot elevations and physical features, including edge of pavements, storm drainage pipes, and other relevant features within the limits of the survey will be identified for inclusion on the topography survey. Proposed profile holes and test holes will be located on the plan."},{"description":"FFX - Site Grading & Development Plan","rate":2000,"detail":"Existing and Proposed Contours, Established Building Setbacks, Driveway & Utilities, Demolition of the existing (if any), Existing parking spaces (if any), Proposed Construction Entrance and Driveway, Limits of Clearing and Grading, Determination of watershed and proposed impervious areas, Required Erosion and Sediment Control Devices, Site Development and Sequences of Construction Notes, Impervious Area Analysis, Watershed for the site and disturbed areas in the watershed, Frontage cover,Standard Construction Details and Certifications, Current INF checklist per ESI (found here: https://www.fairfaxcounty.gov/ land development/sites/land development/ files/assets/documents/forms/infill-lot-grading-plan-checklist.pdf)"},{"description":"Soil Classification","rate":2000,"detail":"Ceed Civil Engineer will facilitate to find Geotech engineer upon request by owner. Fee for soil report is not included. OPTIONAL - IF REQUIRED"},{"description":"EVM Tree Conservation Plan (3rd Party Arborist)","rate":2000,"detail":"Ceed Civil Engineering\'s partner will provide the existing vegetation map and Tree Preservation Plan shall be prepared per Fairfax County PFM chapter 12. Tree preservation target, Tree canopy covered computation shall be provided. A 10 yr tree canopy requirement will be computed, and plantings will propose if required to meet canopy covered requirements. The Tree conservation plan (TCP) shall be signed and sealed by the certified arborist."},{"description":"Drainage Map, Adequacy comp. & Outfall Analysis","rate":2000,"detail":"As required per Fairfax County, CCE will perform outfall analysis for the site in order to ensure that it has adequate outfall in accordance with the PFM and Northern Virginia handbook. The outfall analysis will include pre-development, construction phase, and post-construction phase. CCE will perform field review of existing drainage pattern, set drainage divide, perform required analysis and calculations, and assess the adequacy of the outfall for the site. The Outfall Narrative will include:1.Stormwater runoff computation by runoff reduction method. Stormwater management ordinance Chapter 124.Virginia state regulations. 2.Site-specific Narrative with description of the elements of storm drainage system and adjoining properties. 3. Outfall Locations Map with contributing drainage areas and detailed hydrological and hydraulic calculations. 4. Extent of the outfall analysis per PFM chapter 6. 5. Up to five (5) cross-sections based on field run contour intervals and spot evaluations to verify the outfall adequacy. 6. Permissible velocity, based on roughness coefficient, soil classification, pipe materials, cover material and channel lining (if any). 7. Design velocities compared with the permissible channel velocities (as applicable). 8. Observed erosion conditions along the downstream channel and the presence of erosive conditions. 9. Adequacy of outfall to the bed and banks of the receiving stream. 10. Engineer’s Certification Statement regarding the adequacy of the outfall for the study site. 11. Stormwater Management completion checklists"},{"description":"Building Ht. Computation","rate":200,"detail":"As required per Fairfax County, CCE will perform outfall ana
